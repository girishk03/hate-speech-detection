name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (YouTube module)
        working-directory: Youtube comment classification
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flask flask-socketio python-socketio eventlet joblib

      - name: Import test (YouTube module)
        working-directory: Youtube comment classification
        run: python -c "import app; print('YouTube app import OK')"

      - name: Install deps (Chatroom)
        working-directory: Chatroom
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flask flask-socketio python-socketio eventlet

      - name: Import test (Chatroom)
        working-directory: Chatroom
        run: python -c "import app; print('Chatroom app import OK')"
